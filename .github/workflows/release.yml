name: Release

# A pushed v* tag publishes to npm and creates a GitHub Release whose notes are
# the tag message. Running it by hand from the Actions tab only checks the
# package contents; it does not contact npm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm Trusted Publishing (no stored npm token)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./tests

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the package contents
        if: github.event_name == 'workflow_dispatch'
        run: npm pack --dry-run

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish

      - name: Create the GitHub Release from the tag message
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout can leave a lightweight tag; fetch the annotated one for its message
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
